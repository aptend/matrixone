name: Build Log-2 recovery image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    name: Build and verify Linux amd64
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image tag
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/matrixone-log2-recovery:4.2.8-hotfix-20261119-${GITHUB_SHA::8}-amd64"
          echo "reference=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: optools/images/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.reference }}
          cache-from: type=registry,ref=docker.io/matrixorigin/matrixone:cache-amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify and archive the image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/amd64"
          docker run --rm --entrypoint /mo-service "$IMAGE" -version | tee build-info.txt
          commit=$(sed -n 's/^[[:space:]]*Git commit ID: //p' build-info.txt)
          [[ ${#commit} -ge 7 && "$GITHUB_SHA" == "$commit"* ]]
          docker save "$IMAGE" | gzip -1 > matrixone-log2-recovery-amd64.tar.gz
          sha256sum matrixone-log2-recovery-amd64.tar.gz > SHA256SUMS

      - name: Upload the image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: matrixone-log2-recovery-amd64
          path: |
            matrixone-log2-recovery-amd64.tar.gz
            SHA256SUMS
            build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify the image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          docker buildx imagetools inspect "$reference" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" \
              '.os == "linux" and .architecture == "amd64" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          printf 'Linux amd64 image `%s`\n\nDigest reference `%s`\n' "$IMAGE" "$reference" |
            tee -a "$GITHUB_STEP_SUMMARY"
